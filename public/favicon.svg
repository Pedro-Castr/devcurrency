<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="barGradient" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>
  </defs>

  <rect width="128" height="128" rx="28" fill="#12151d" />
  <rect width="128" height="128" rx="28" fill="none" stroke="#232838" stroke-width="1.5" />

  <!-- Barras ascendentes: referência a candles/volume de mercado -->
  <rect x="30" y="72" width="14" height="30" rx="3" fill="#5b6272" />
  <rect x="50" y="58" width="14" height="44" rx="3" fill="#8b92a5" />
  <rect x="70" y="42" width="14" height="60" rx="3" fill="#3b82f6" />
  <rect x="90" y="26" width="14" height="76" rx="3" fill="url(#barGradient)" />

  <!-- Seta de tendência de alta, cruzando as barras -->
  <path
    d="M28 96 L54 62 L74 76 L100 30"
    fill="none"
    stroke="#22c55e"
    stroke-width="4"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M86 30 L100 30 L100 44"
    fill="none"
    stroke="#22c55e"
    stroke-width="4"
    stroke-linecap="round"
